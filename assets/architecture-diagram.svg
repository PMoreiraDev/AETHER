<svg viewBox="0 0 1300 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A12"/>
      <stop offset="100%" stop-color="#0C1019"/>
    </linearGradient>
    <linearGradient id="chrome2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD0D9"/>
      <stop offset="100%" stop-color="#868C99"/>
    </linearGradient>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#AEB4C2"/>
    </marker>
  </defs>

  <rect width="1300" height="1000" fill="url(#bg2)"/>

  <!-- local core boundary -->
  <rect x="40" y="30" width="820" height="930" rx="20" fill="none" stroke="#454B5A" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
  <text x="66" y="64" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8B92A2" letter-spacing="3">LOCAL CORE — ON YOUR DEVICE BY DEFAULT</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="middle" fill="#EDEFF3">

    <!-- View -->
    <rect x="310" y="96" width="280" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="450" y="136">View · JavaFX</text>

    <!-- Controller -->
    <rect x="310" y="206" width="280" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="450" y="246">Controller</text>

    <!-- Service -->
    <rect x="310" y="316" width="280" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="450" y="356">Service</text>

    <!-- Repository / Context Engine -->
    <rect x="100" y="436" width="230" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="215" y="476">Repository</text>

    <rect x="570" y="436" width="230" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="685" y="476">Context Engine</text>

    <!-- SQLite / Context Graph -->
    <rect x="100" y="546" width="230" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="215" y="586">SQLite</text>

    <rect x="570" y="546" width="230" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="685" y="586">Context Graph</text>

    <!-- AI Provider -->
    <rect x="310" y="676" width="280" height="66" rx="13" fill="#10141F" stroke="url(#chrome2)" stroke-width="1.8"/>
    <text x="450" y="716">AI Provider</text>

    <!-- Ollama -->
    <rect x="290" y="800" width="320" height="80" rx="16" fill="#151A26" stroke="url(#chrome2)" stroke-width="2.5"/>
    <text x="450" y="836" font-size="15" fill="#9BA1AF" letter-spacing="2" font-weight="500">OLLAMA</text>
    <text x="450" y="862" font-size="17" fill="#EDEFF3" font-weight="500">local domain · your hardware</text>
  </g>

  <!-- accent dot on Ollama node -->
  <circle cx="565" cy="812" r="4.5" fill="#FFFFFF"/>

  <!-- connecting lines inside local core -->
  <g stroke="#AEB4C2" stroke-width="1.6" stroke-opacity="0.55" fill="none">
    <line x1="450" y1="162" x2="450" y2="200" marker-end="url(#arrow2)"/>
    <line x1="450" y1="272" x2="450" y2="310" marker-end="url(#arrow2)"/>
    <line x1="450" y1="382" x2="215" y2="430" marker-end="url(#arrow2)"/>
    <line x1="450" y1="382" x2="685" y2="430" marker-end="url(#arrow2)"/>
    <line x1="215" y1="502" x2="215" y2="540" marker-end="url(#arrow2)"/>
    <line x1="685" y1="502" x2="685" y2="540" marker-end="url(#arrow2)"/>
    <line x1="215" y1="612" x2="450" y2="670" marker-end="url(#arrow2)"/>
    <line x1="685" y1="612" x2="450" y2="670" marker-end="url(#arrow2)"/>
    <line x1="450" y1="742" x2="450" y2="794" marker-end="url(#arrow2)"/>
  </g>

  <!-- optional Connected AETHER layer, outside the local boundary -->
  <rect x="960" y="560" width="300" height="130" rx="18" fill="#12161F" stroke="url(#chrome2)" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="1110" y="608" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#EDEFF3" text-anchor="middle" letter-spacing="1">CONNECTED AETHER</text>
  <text x="1110" y="636" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9BA1AF" text-anchor="middle">optional · opt-in</text>
  <text x="1110" y="662" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#9BA1AF" text-anchor="middle">shared context only</text>

  <!-- dashed link from local core to Connected AETHER -->
  <line x1="590" y1="709" x2="955" y2="625" stroke="#AEB4C2" stroke-width="1.6" stroke-opacity="0.55" stroke-dasharray="5 5" marker-end="url(#arrow2)"/>
  <text x="765" y="655" font-family="Helvetica, Arial, sans-serif" font-size="13" font-style="italic" fill="#8B92A2" text-anchor="middle">only what you explicitly share</text>
</svg>
