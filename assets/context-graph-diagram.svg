<svg viewBox="0 0 920 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9CDD6"/>
    </marker>
    <linearGradient id="chrome3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD0D9"/>
      <stop offset="100%" stop-color="#868C99"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="920" height="500" fill="#0A0C16"/>

  <!-- Local boundary -->
  <rect x="15" y="66" width="890" height="284" rx="20" fill="none" stroke="#454B5A" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.55"/>
  <text x="25" y="48" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#8B92A2" letter-spacing="3">LOCAL, ON YOUR DEVICE BY DEFAULT</text>

  <!-- Column titles -->
  <text x="155" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#F2F3F5" text-anchor="middle">Your Life</text>
  <text x="765" y="100" font-family="'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#F2F3F5" text-anchor="middle">Your AI</text>

  <!-- Box 1: Your Life -->
  <rect x="40" y="125" width="230" height="200" rx="16" fill="#141726" stroke="#2E3345" stroke-width="1.5"/>
  <text x="70" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA0B2">• Tasks</text>
  <text x="70" y="203" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA0B2">• Notes</text>
  <text x="70" y="236" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA0B2">• People</text>
  <text x="70" y="269" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA0B2">• Projects</text>
  <text x="70" y="302" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA0B2">• Decisions</text>

  <!-- Box 2: Context Graph -->
  <rect x="345" y="125" width="230" height="200" rx="16" fill="#141726" stroke="#2E3345" stroke-width="1.5"/>
  <g stroke="#4A5066" stroke-width="2">
    <line x1="410" y1="170" x2="460" y2="220"/>
    <line x1="510" y1="170" x2="460" y2="220"/>
    <line x1="460" y1="220" x2="400" y2="270"/>
    <line x1="460" y1="220" x2="520" y2="270"/>
    <line x1="410" y1="170" x2="510" y2="170"/>
  </g>
  <circle cx="460" cy="220" r="9" fill="#F2F3F5"/>
  <circle cx="410" cy="170" r="7" fill="#C9CDD6"/>
  <circle cx="510" cy="170" r="7" fill="#C9CDD6"/>
  <circle cx="400" cy="270" r="7" fill="#C9CDD6"/>
  <circle cx="520" cy="270" r="7" fill="#C9CDD6"/>
  <text x="460" y="305" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#6C7386" text-anchor="middle">everything, linked automatically</text>

  <!-- Box 3: Your AI -->
  <rect x="650" y="125" width="230" height="200" rx="16" fill="#141726" stroke="#2E3345" stroke-width="1.5"/>
  <circle cx="765" cy="195" r="26" fill="none" stroke="#C9CDD6" stroke-width="3"/>
  <circle cx="765" cy="195" r="7" fill="#F2F3F5"/>
  <text x="765" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA0B2" text-anchor="middle">Understands what</text>
  <text x="765" y="271" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9AA0B2" text-anchor="middle">you're doing and why</text>

  <!-- Arrows -->
  <line x1="278" y1="225" x2="335" y2="225" stroke="#C9CDD6" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="583" y1="225" x2="640" y2="225" stroke="#C9CDD6" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Optional Connected AETHER layer -->
  <line x1="460" y1="325" x2="460" y2="398" stroke="#AEB4C2" stroke-width="1.6" stroke-opacity="0.55" stroke-dasharray="5 5" marker-end="url(#arrow)"/>
  <text x="460" y="368" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#8B92A2" text-anchor="middle">only what you explicitly share</text>

  <rect x="330" y="400" width="260" height="70" rx="14" fill="#12161F" stroke="url(#chrome3)" stroke-width="1.8" stroke-dasharray="7 5"/>
  <text x="460" y="428" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#EDEFF3" text-anchor="middle" letter-spacing="1">CONNECTED AETHER</text>
  <text x="460" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#9BA1AF" text-anchor="middle">optional · shared context only</text>
</svg>
