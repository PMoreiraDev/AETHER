<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A12"/>
      <stop offset="100%" stop-color="#0C1019"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD0D9"/>
      <stop offset="100%" stop-color="#868C99"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#7EEBFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </radialGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7B8496"/>
    </marker>
    <marker id="arrowAccent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#22D3EE"/>
    </marker>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Header -->
  <text x="600" y="42" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="14" fill="#8B92A2" letter-spacing="4">
    THE CONTEXT GRAPH · THE STRUCTURE BEHIND AETHER
  </text>
  <text x="600" y="76" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="28" font-weight="700" fill="#F2F3F5">
    Your world is connected — not stored as isolated records.
  </text>
  <text x="600" y="103" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="13" fill="#737C8E">
    Every entity can gain meaning from the relationships around it.
  </text>

  <!-- Graph boundary -->
  <rect x="60" y="130" width="1080" height="480" rx="26"
        fill="#0E121C" stroke="#252C3C" stroke-width="1.5"/>

  <!-- Relationship layer -->
  <g stroke="#394154" stroke-width="1.8" stroke-dasharray="6 7" opacity="0.9">
    <line x1="600" y1="240" x2="860" y2="330"/>
    <line x1="860" y1="330" x2="770" y2="520"/>
    <line x1="770" y1="520" x2="430" y2="520"/>
    <line x1="430" y1="520" x2="340" y2="330"/>
    <line x1="340" y1="330" x2="600" y2="240"/>
  </g>

  <!-- User spokes -->
  <g stroke="#566075" stroke-width="2.5" opacity="0.8">
    <line x1="600" y1="380" x2="600" y2="240"/>
    <line x1="600" y1="380" x2="860" y2="330"/>
    <line x1="600" y1="380" x2="770" y2="520"/>
    <line x1="600" y1="380" x2="430" y2="520"/>
    <line x1="600" y1="380" x2="340" y2="330"/>
  </g>

  <!-- Additional contextual edges -->
  <g stroke="#22D3EE" stroke-width="2.2" stroke-opacity="0.55">
    <line x1="600" y1="240" x2="770" y2="520"/>
    <line x1="860" y1="330" x2="430" y2="520"/>
  </g>

  <!-- Center / Profile -->
  <circle cx="600" cy="380" r="52" fill="#07151B" stroke="#22D3EE" stroke-width="2.5" filter="url(#glow)"/>
  <circle cx="600" cy="380" r="43" fill="url(#coreGlow)"/>
  <text x="600" y="376" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="800" fill="#04222B">
    YOU
  </text>
  <text x="600" y="395" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="10" font-weight="700" fill="#04222B" letter-spacing="1.5">
    PROFILE
  </text>

  <!-- Person -->
  <circle cx="600" cy="240" r="29" fill="#6366F1" stroke="#0E121C" stroke-width="2.5"/>
  <text x="600" y="246" text-anchor="middle" font-size="13" font-weight="800"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">P</text>
  <text x="600" y="196" text-anchor="middle" font-size="17" font-weight="700"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#F2F3F5">People</text>
  <text x="600" y="216" text-anchor="middle" font-size="11"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#858EA0">
    identity · relationships · context
  </text>

  <!-- Project -->
  <circle cx="860" cy="330" r="29" fill="#F59E0B" stroke="#0E121C" stroke-width="2.5"/>
  <text x="860" y="336" text-anchor="middle" font-size="12" font-weight="800"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#1A1200">PR</text>
  <text x="910" y="300" text-anchor="start" font-size="17" font-weight="700"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#F2F3F5">Projects</text>
  <text x="910" y="320" text-anchor="start" font-size="11"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#858EA0">
    outcomes · status · deadlines
  </text>

  <!-- Task -->
  <circle cx="770" cy="520" r="29" fill="#34D399" stroke="#0E121C" stroke-width="2.5"/>
  <text x="770" y="526" text-anchor="middle" font-size="13" font-weight="800"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#022C22">T</text>
  <text x="770" y="568" text-anchor="middle" font-size="17" font-weight="700"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#F2F3F5">Tasks</text>
  <text x="770" y="588" text-anchor="middle" font-size="11"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#858EA0">
    actions · priority · dependencies
  </text>

  <!-- Event -->
  <circle cx="430" cy="520" r="29" fill="#A78BFA" stroke="#0E121C" stroke-width="2.5"/>
  <text x="430" y="526" text-anchor="middle" font-size="13" font-weight="800"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#1E1035">E</text>
  <text x="430" y="568" text-anchor="middle" font-size="17" font-weight="700"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#F2F3F5">Events</text>
  <text x="430" y="588" text-anchor="middle" font-size="11"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#858EA0">
    time · commitments · location
  </text>

  <!-- Notes -->
  <circle cx="340" cy="330" r="29" fill="#818CF8" stroke="#0E121C" stroke-width="2.5"/>
  <text x="340" y="336" text-anchor="middle" font-size="13" font-weight="800"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">N</text>
  <text x="290" y="300" text-anchor="end" font-size="17" font-weight="700"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#F2F3F5">Notes</text>
  <text x="290" y="320" text-anchor="end" font-size="11"
        font-family="'Helvetica Neue', Arial, sans-serif" fill="#858EA0">
    free-form knowledge
  </text>

  <!-- Callout -->
  <rect x="130" y="640" width="940" height="76" rx="18"
        fill="#111721" stroke="#2D3547" stroke-width="1.3"/>
  <circle cx="170" cy="678" r="14" fill="#0D2A31" stroke="#22D3EE" stroke-width="1.5"/>
  <path d="M164 678 l5 5 l9 -10" fill="none" stroke="#22D3EE" stroke-width="2"/>

  <text x="200" y="670" text-anchor="start"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="14" font-weight="700" fill="#EDEFF3">
    HOW CONNECTIONS ARE CREATED
  </text>
  <text x="200" y="692" text-anchor="start"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="12" fill="#8D96A7">
    A [[wikilink]] in an entity's Markdown content becomes a traversable relationship.
  </text>

  <!-- Footer legend -->
  <text x="600" y="742" text-anchor="middle"
        font-family="'Helvetica Neue', Arial, sans-serif"
        font-size="11" fill="#626B7D">
    The graph is context infrastructure: relationships can be retrieved and used by AETHER's intelligence layer.
  </text>
</svg>
